[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    registration: F01 user registration
    login: F02 authentication lifecycle, login and logout
    password_reset: F09 password reset request UI (email delivery excluded)
    search: F03 product search
    wishlist: F07 wish list (Member 4)
    edit_account: F11 edit account information (Member 4)
    address_book: F12 address book (Member 4)
    creates_account: creates a disposable account (requires --allow-account-creation)
