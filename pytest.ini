[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    registration: F01 user registration
    login: F02 user login
    search: F03 product search
    product_details: F04 product details
    product_comparison: F08 product comparison
    creates_account: creates a disposable account (requires --allow-account-creation)
