[pytest]
testpaths = tests
# Run dashboard checks separately from website scenarios.
norecursedirs = tests/reporting
pythonpath = .
addopts = -ra --strict-markers
markers =
    registration: F01 user registration
    login: F02 user login
    logout: F09 user logout
    search: F03 product search
    creates_account: creates a disposable account (requires --allow-account-creation)
